<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models - Neural Network Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-brain me-2 text-primary"></i>Neural Network Studio
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/models">Models</a>
                <a class="nav-link" href="/training">Training</a>
                <a class="nav-link" href="/analysis">Analysis</a>
            </div>
        </div>
    </nav>
    
    <div class="container py-5">
        <h1 class="mb-4">Model Management</h1>
        
        <div class="mb-4">
            <button class="btn btn-primary" onclick="showCreateModelModal()">
                <i class="fas fa-plus me-2"></i>Create New Model
            </button>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Accuracy</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="models-table">
                            <tr>
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно создания модели -->
    <div class="modal fade" id="createModelModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Model</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createModelForm">
                        <div class="mb-3">
                            <label class="form-label">Model Name</label>
                            <input type="text" class="form-control" id="modelName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Model Type</label>
                            <select class="form-select" id="modelType" required>
                                <option value="CNN">CNN - Image Classification</option>
                                <option value="MLP">MLP - Tabular Data</option>
                                <option value="LSTM">LSTM - Text/Sequences</option>
                                <option value="Custom">Custom Architecture</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Epochs</label>
                            <input type="number" class="form-control" id="epochs" value="10" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Batch Size</label>
                            <input type="number" class="form-control" id="batchSize" value="32" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Learning Rate</label>
                            <input type="number" class="form-control" id="learningRate" value="0.001" step="0.0001">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createModel()">Create Model</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        let modal = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            loadModels();
            
            // Проверка hash для выделения конкретной модели
            const modelId = window.location.hash.substring(1);
            if (modelId) {
                setTimeout(() => highlightModel(modelId), 1000);
            }
        });
        
        function showCreateModelModal() {
            if (!modal) {
                modal = new bootstrap.Modal(document.getElementById('createModelModal'));
            }
            modal.show();
        }
        
        async function loadModels() {
            try {
                const response = await axios.get('/api/models');
                const models = response.data;
                
                const tableBody = document.getElementById('models-table');
                
                if (models.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center">
                                <p class="text-muted">No models found</p>
                                <button class="btn btn-primary" onclick="showCreateModelModal()">
                                    Create Your First Model
                                </button>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                let html = '';
                models.forEach(model => {
                    const accuracy = model.accuracy ? (model.accuracy * 100).toFixed(1) + '%' : 'N/A';
                    const date = new Date(model.created_at).toLocaleDateString();
                    
                    // Определяем цвет статуса
                    let statusClass = 'secondary';
                    if (model.status === 'trained') statusClass = 'success';
                    if (model.status === 'training') statusClass = 'warning';
                    if (model.status === 'failed') statusClass = 'danger';
                    
                    html += `
                        <tr id="model-${model.id}">
                            <td class="fw-bold">${model.name}</td>
                            <td><span class="badge bg-info">${model.model_type}</span></td>
                            <td><span class="badge bg-${statusClass}">${model.status}</span></td>
                            <td>${accuracy}</td>
                            <td>${date}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-2" onclick="viewModel('${model.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteModel('${model.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                tableBody.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading models:', error);
                document.getElementById('models-table').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">
                            <div class="alert alert-danger">Error loading models</div>
                        </td>
                    </tr>
                `;
            }
        }
        
        async function createModel() {
            try {
                const modelName = document.getElementById('modelName').value;
                const modelType = document.getElementById('modelType').value;
                const epochs = parseInt(document.getElementById('epochs').value);
                const batchSize = parseInt(document.getElementById('batchSize').value);
                const learningRate = parseFloat(document.getElementById('learningRate').value);
                
                const response = await axios.post('/api/models', {
                    name: modelName,
                    model_type: modelType,
                    hyperparameters: {
                        epochs: epochs,
                        batch_size: batchSize,
                        learning_rate: learningRate
                    }
                });
                
                alert('Model created successfully!');
                modal.hide();
                loadModels();
                
            } catch (error) {
                console.error('Error creating model:', error);
                alert(`Error: ${error.response?.data?.detail || error.message}`);
            }
        }
        
        async function deleteModel(modelId) {
            if (!confirm('Are you sure you want to delete this model?')) {
                return;
            }
            
            try {
                await axios.delete(`/api/models/${modelId}`);
                alert('Model deleted successfully!');
                loadModels();
            } catch (error) {
                console.error('Error deleting model:', error);
                alert(`Error: ${error.response?.data?.detail || error.message}`);
            }
        }
        
        function viewModel(modelId) {
            // Переход на страницу анализа модели
            window.location.href = `/analysis?model=${modelId}`;
        }
        
        function highlightModel(modelId) {
            const row = document.getElementById(`model-${modelId}`);
            if (row) {
                row.classList.add('table-primary');
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
