<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training - Neural Network Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-brain me-2 text-primary"></i>Neural Network Studio
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/models">Models</a>
                <a class="nav-link active" href="/training">Training</a>
                <a class="nav-link" href="/analysis">Analysis</a>
            </div>
        </div>
    </nav>
    
    <div class="container py-5">
        <h1 class="mb-4">Model Training</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Select Model to Train</h5>
                <select class="form-select mb-3" id="modelSelect">
                    <option value="">Select a model...</option>
                </select>
                
                <div id="trainingConfig" style="display: none;">
                    <hr>
                    <h6 class="mb-3">Training Configuration</h6>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Epochs</label>
                            <input type="number" class="form-control" id="epochs" value="10" min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Batch Size</label>
                            <input type="number" class="form-control" id="batchSize" value="32" min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Learning Rate</label>
                            <input type="number" class="form-control" id="learningRate" value="0.001" step="0.0001">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Dataset</label>
                        <select class="form-select" id="dataset">
                            <option value="mnist">MNIST - Handwritten Digits</option>
                            <option value="cifar10">CIFAR-10 - Small Images</option>
                            <option value="iris">Iris - Flower Classification</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" onclick="startTraining()">
                        <i class="fas fa-play me-2"></i>Start Training
                    </button>
                </div>
            </div>
        </div>
        
        <div id="trainingProgress" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Training Progress</h5>
                    <div class="progress mb-3" style="height: 25px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%">0%</div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <p><strong>Epoch:</strong> <span id="currentEpoch">0</span>/<span id="totalEpochs">0</span></p>
                        </div>
                        <div class="col-md-3">
                            <p><strong>Loss:</strong> <span id="currentLoss">0.0000</span></p>
                        </div>
                        <div class="col-md-3">
                            <p><strong>Accuracy:</strong> <span id="currentAccuracy">0%</span></p>
                        </div>
                        <div class="col-md-3">
                            <p><strong>Time:</strong> <span id="trainingElapsed">0s</span></p>
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="stopTraining()">
                        <i class="fas fa-stop me-2"></i>Stop Training
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadTrainableModels();
            
            // Проверка параметра URL
            const urlParams = new URLSearchParams(window.location.search);
            const modelId = urlParams.get('model');
            if (modelId) {
                setTimeout(() => {
                    document.getElementById('modelSelect').value = modelId;
                    showTrainingConfig();
                }, 500);
            }
        });
        
        async function loadTrainableModels() {
            try {
                const response = await axios.get('/api/models');
                const models = response.data;
                
                const select = document.getElementById('modelSelect');
                select.innerHTML = '<option value="">Select a model...</option>';
                
                const trainableModels = models.filter(m => m.status === 'not_trained' || m.status === 'failed');
                
                trainableModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = `${model.name} (${model.model_type})`;
                    select.appendChild(option);
                });
                
                select.addEventListener('change', showTrainingConfig);
                
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }
        
        function showTrainingConfig() {
            const modelId = document.getElementById('modelSelect').value;
            if (modelId) {
                document.getElementById('trainingConfig').style.display = 'block';
            } else {
                document.getElementById('trainingConfig').style.display = 'none';
            }
        }
        
        async function startTraining() {
            const modelId = document.getElementById('modelSelect').value;
            const epochs = parseInt(document.getElementById('epochs').value);
            const batchSize = parseInt(document.getElementById('batchSize').value);
            const learningRate = parseFloat(document.getElementById('learningRate').value);
            const dataset = document.getElementById('dataset').value;
            
            if (!modelId) {
                alert('Please select a model first');
                return;
            }
            
            try {
                // Показать прогресс
                document.getElementById('trainingConfig').style.display = 'none';
                document.getElementById('trainingProgress').style.display = 'block';
                
                // Начать тренировку
                const response = await axios.post('/api/train', {
                    model_id: modelId,
                    dataset: dataset,
                    epochs: epochs,
                    batch_size: batchSize,
                    learning_rate: learningRate
                });
                
                alert('Training started!');
                
                // Обновить метрики (в реальной системе здесь был бы WebSocket или polling)
                updateTrainingProgress(modelId);
                
            } catch (error) {
                console.error('Error starting training:', error);
                alert(`Error: ${error.response?.data?.detail || error.message}`);
                document.getElementById('trainingConfig').style.display = 'block';
                document.getElementById('trainingProgress').style.display = 'none';
            }
        }
        
        async function updateTrainingProgress(modelId) {
            // Симуляция прогресса (в реальной системе здесь был бы запрос к API)
            let progress = 0;
            const totalEpochs = parseInt(document.getElementById('epochs').value);
            
            document.getElementById('totalEpochs').textContent = totalEpochs;
            
            const interval = setInterval(async () => {
                if (progress >= 100) {
                    clearInterval(interval);
                    alert('Training completed!');
                    window.location.href = `/analysis?model=${modelId}`;
                    return;
                }
                
                progress += 5;
                const currentEpoch = Math.floor(progress / (100 / totalEpochs));
                
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressBar').textContent = progress + '%';
                document.getElementById('currentEpoch').textContent = currentEpoch;
                document.getElementById('currentLoss').textContent = (1.0 - progress/100).toFixed(4);
                document.getElementById('currentAccuracy').textContent = progress.toFixed(1) + '%';
                document.getElementById('trainingElapsed').textContent = (progress * 2) + 's';
                
            }, 1000);
            
            window.trainingInterval = interval;
        }
        
        function stopTraining() {
            if (window.trainingInterval) {
                clearInterval(window.trainingInterval);
                alert('Training stopped!');
                document.getElementById('trainingConfig').style.display = 'block';
                document.getElementById('trainingProgress').style.display = 'none';
            }
        }
    </script>
</body>
</html>
