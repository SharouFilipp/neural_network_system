<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis - Neural Network Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-brain me-2 text-primary"></i>Neural Network Studio
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/models">Models</a>
                <a class="nav-link" href="/training">Training</a>
                <a class="nav-link active" href="/analysis">Analysis</a>
            </div>
        </div>
    </nav>
    
    <div class="container py-5">
        <h1 class="mb-4">Model Analysis</h1>
        
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Select Model</h5>
                        <select class="form-select mb-3" id="modelSelect" onchange="loadModelAnalysis()">
                            <option value="">Select a model...</option>
                        </select>
                        <div id="modelInfo" style="display: none;">
                            <hr>
                            <p><strong>Type:</strong> <span id="modelType"></span></p>
                            <p><strong>Status:</strong> <span id="modelStatus"></span></p>
                            <p><strong>Created:</strong> <span id="modelCreated"></span></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div id="analysisContent" style="display: none;">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Model Metrics</h5>
                            <div class="row">
                                <div class="col-md-3 text-center">
                                    <div class="display-6 fw-bold text-success" id="accuracyValue">0%</div>
                                    <small class="text-muted">Accuracy</small>
                                </div>
                                <div class="col-md-3 text-center">
                                    <div class="display-6 fw-bold text-danger" id="lossValue">0.0000</div>
                                    <small class="text-muted">Loss</small>
                                </div>
                                <div class="col-md-3 text-center">
                                    <div class="display-6 fw-bold text-info" id="trainingTime">0s</div>
                                    <small class="text-muted">Training Time</small>
                                </div>
                                <div class="col-md-3 text-center">
                                    <div class="display-6 fw-bold text-warning" id="datasetSize">0</div>
                                    <small class="text-muted">Dataset Size</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Actions</h5>
                            <div class="btn-group">
                                <button class="btn btn-primary" onclick="generateReport()">
                                    <i class="fas fa-file-pdf me-2"></i>Generate Report
                                </button>
                                <button class="btn btn-success" onclick="retrainModel()">
                                    <i class="fas fa-redo me-2"></i>Retrain Model
                                </button>
                                <button class="btn btn-info" onclick="downloadModel()">
                                    <i class="fas fa-download me-2"></i>Download Model
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="noModelSelected" class="text-center py-5">
                    <i class="fas fa-chart-bar fa-4x text-muted mb-4"></i>
                    <h4 class="text-muted">Select a model to analyze</h4>
                    <p class="text-muted">Choose a trained model from the dropdown to view its performance metrics</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadTrainedModels();
            
            // Проверка параметра URL
            const urlParams = new URLSearchParams(window.location.search);
            const modelId = urlParams.get('model');
            if (modelId) {
                setTimeout(() => {
                    document.getElementById('modelSelect').value = modelId;
                    loadModelAnalysis();
                }, 500);
            }
        });
        
        async function loadTrainedModels() {
            try {
                const response = await axios.get('/api/models');
                const models = response.data;
                
                const select = document.getElementById('modelSelect');
                select.innerHTML = '<option value="">Select a model...</option>';
                
                const trainedModels = models.filter(m => m.status === 'trained');
                
                trainedModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = `${model.name} (${(model.accuracy * 100).toFixed(1)}%)`;
                    select.appendChild(option);
                });
                
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }
        
        async function loadModelAnalysis() {
            const modelId = document.getElementById('modelSelect').value;
            
            if (!modelId) {
                document.getElementById('analysisContent').style.display = 'none';
                document.getElementById('noModelSelected').style.display = 'block';
                return;
            }
            
            try {
                // Показать загрузку
                document.getElementById('analysisContent').style.display = 'block';
                document.getElementById('noModelSelected').style.display = 'none';
                
                // Загрузить информацию о модели
                const response = await axios.get(`/api/models/${modelId}`);
                const model = response.data;
                
                // Обновить информацию о модели
                document.getElementById('modelInfo').style.display = 'block';
                document.getElementById('modelType').textContent = model.model_type;
                document.getElementById('modelStatus').textContent = model.status;
                document.getElementById('modelCreated').textContent = 
                    new Date(model.created_at).toLocaleDateString();
                
                // Обновить метрики
                document.getElementById('accuracyValue').textContent = 
                    model.accuracy ? (model.accuracy * 100).toFixed(1) + '%' : 'N/A';
                document.getElementById('lossValue').textContent = 
                    model.loss ? model.loss.toFixed(4) : 'N/A';
                document.getElementById('trainingTime').textContent = 
                    model.training_time ? model.training_time.toFixed(1) + 's' : 'N/A';
                document.getElementById('datasetSize').textContent = 
                    model.dataset_size || 'N/A';
                
            } catch (error) {
                console.error('Error loading model analysis:', error);
                alert(`Error: ${error.response?.data?.detail || error.message}`);
            }
        }
        
        function generateReport() {
            const modelId = document.getElementById('modelSelect').value;
            if (!modelId) {
                alert('Please select a model first');
                return;
            }
            window.open(`/api/reports/${modelId}/pdf`, '_blank');
        }
        
        function retrainModel() {
            const modelId = document.getElementById('modelSelect').value;
            if (!modelId) {
                alert('Please select a model first');
                return;
            }
            window.location.href = `/training?model=${modelId}`;
        }
        
        function downloadModel() {
            alert('Download feature coming soon!');
        }
    </script>
</body>
</html>
